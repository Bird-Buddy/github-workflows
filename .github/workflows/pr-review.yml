# Reusable Claude PR review (raw `claude -p` on a Team seat).
# Repo-agnostic: it orients itself from the CALLER repo's CLAUDE.md + code, so one
# definition serves every repo. Improve it here once → every caller gets it.
#
# Caller usage (.github/workflows/pr-review.yml in each repo):
#
#   name: PR review
#   on:
#     pull_request:
#       types: [opened, reopened, ready_for_review, synchronize, labeled]
#   jobs:
#     review:
#       uses: Bird-Buddy/github-workflows/.github/workflows/pr-review.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.BB_ANTHROPIC_TEAM_TOKEN }}
#
# Caller must also have: a CLAUDE.md (the review's context/standard) and the
# BB_ANTHROPIC_TEAM_TOKEN secret (a `claude setup-token` Team seat token).
# Per-PR deeper review: add the `deep-review` label → Opus 5.5 + high effort.
# Global model override: set repo Variable BB_REVIEW_MODEL (e.g. claude-sonnet-5).

name: PR review (reusable, claude -p)

on:
  workflow_call:
    inputs:
      default_model:
        description: Model to use when there is no deep-review label and no BB_REVIEW_MODEL var.
        type: string
        required: false
        default: claude-sonnet-4-6
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Team seat OAuth token (from `claude setup-token`).
        required: true

jobs:
  review:
    # Automatic on every non-draft, human-authored PR. On `labeled` only fire for
    # the deep-review label (avoids re-running on unrelated label churn).
    if: >-
      github.event.pull_request.draft == false &&
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      !endsWith(github.actor, '[bot]') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deep-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      REVIEW_MODEL: ${{ (contains(github.event.pull_request.labels.*.name, 'deep-review') && 'claude-opus-5-5') || vars.BB_REVIEW_MODEL || inputs.default_model }}
      REVIEW_EFFORT: ${{ contains(github.event.pull_request.labels.*.name, 'deep-review') && 'high' || 'medium' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Review PR
        run: |
          claude -p "You are an expert code reviewer doing ONE concise, holistic review of PR #$PR in repo $REPO that ends in a clear overall opinion. Do NOT spawn sub-agents. Do NOT post inline comments or committable suggestions — one skimmable comment with your judgement.

          Steps:
          1. Orient to the repo (cheaply). Read CLAUDE.md / AGENTS.md / CONTRIBUTING.md if present and glance at the layout to learn what this codebase is, which stack(s) each changed area uses, and the conventions it holds itself to. Judge each changed area by its own stack's standards. CLAUDE.md is the standard; the repo's existing style is the bar, never your own preference.
          2. PR context: gh pr view $PR --json title,body,headRefName,baseRefName,labels,comments.
          3. Re-review handling. Among the comments find the MOST RECENT one signed 'Reviewed automatically by Claude Code'. If it listed 🔴, verify each was actually fixed in the current diff (do not assume). If it listed 🟠, re-check each and do NOT re-flag one a human has replied to / accepted. If 'No blocking issues.', review normally. If none, first review.
          4. Tracker grounding. Ticket ids look like PREFIX-number and appear in headRefName or the title. If a tracker posted a linkback comment with the ticket title+description, read it from the comments you fetched and treat the ticket REQUIREMENTS as the source of truth for the objective (a different-but-valid approach is fine). If no ticket, review against the PR description. Never fail the review over a missing ticket.
          5. Read BEYOND the diff — this separates a real review from a diff-checker. Run gh pr diff $PR, then for the changed code READ the touched files in full and Grep for the key callers / tests / usages of anything whose contract changed (a function signature, an exported symbol, a config/lock entry, an infra resource). Judge whether the change breaks something its callers rely on. Keep this targeted, not a whole-repo audit.
          6. Classify findings against the failure modes CLAUDE.md says matter for this repo:
             🔴 Blocker — only if confident: a correctness/security regression, or an unmet hard requirement from the ticket.
             🟠 Potential issue — a real risk needing a human decision, where safety depends on something the diff alone cannot prove. Walk these precondition classes and flag any the PR neither includes nor mentions, stating EXACTLY what a human must verify: ORDERING (something must land/deploy/publish/migrate first); PERSISTED SHAPE (data/artifacts/state already written that this now reads/writes differently); CONSUMER COMPATIBILITY (callers, services, or clients this diff cannot see); CONFIGURATION (a var/flag/credential/permission that must exist first); REPEAT SAFETY (retry/rerun/concurrent/partial-failure). A class with nothing real behind it is NOT a finding.
             🔵 Suggestion — up to 3 concrete non-blocking improvements on code the PR touches.
             Keep 🔴/🟠 low-noise: no style/nits, no scratch/experiment code, no generated/fetched artifacts, no pre-existing issues. Unsure 🔴 -> 🟠; unsure 🟠 -> drop.
          7. Write ONE concise review to /tmp/review.md (Write tool) and post it: gh pr comment $PR --body-file /tmp/review.md
             - Open with '## Review' then a 1-2 sentence VERDICT in your own words: what the PR does and your overall opinion (looks good to merge / one risk to decide first / needs a fix before merge). A judgement, not a restatement of the diff. Be direct.
             - Then, only if present: a '**Blockers**' section (🔴, each citing file:line) and a '**Verify before merge**' section (🟠, each citing file:line and exactly what a human must check). If neither, write one line: 'No blocking issues.'
             - Optionally a short '**Suggestions**' section (🔵, up to 3, one line each) as plain prose. No committable suggestion blocks, no inline comments.
             - Keep it tight and skimmable — a reviewer's opinion, not an exhaustive list. Only 🔴 🟠 🔵 emojis. End with the italic line: _Reviewed automatically by Claude Code (claude -p, team seat)_
             Then confirm in chat what you posted." \
            --model "$REVIEW_MODEL" \
            --effort "$REVIEW_EFFORT" \
            --output-format json \
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob,Write" | tee /tmp/claude-out.json
          echo "===== TOKEN USAGE / COST (claude -p) ====="
          jq '{num_turns, duration_ms, total_cost_usd, usage: {input_tokens: .usage.input_tokens, output_tokens: .usage.output_tokens, cache_creation_input_tokens: .usage.cache_creation_input_tokens, cache_read_input_tokens: .usage.cache_read_input_tokens}}' /tmp/claude-out.json 2>/dev/null || tail -5 /tmp/claude-out.json
