# Org-wide Claude PR review — enforced by the org ruleset "Claude PR review"
# (Require workflows to pass → this file). No per-repo workflow needed: GitHub
# runs this on every PR in every repo the ruleset targets.
#
# The logic lives in review/ (prompt, run + post scripts, tests). This workflow
# fetches review/ from github-workflows at the SAME commit it runs from, so the
# ruleset ref alone decides which version runs (point it at a branch to test).
#
# Per-repo context, all optional: CLAUDE.md (general repo standard) and
# .github/review.md or REVIEW.md (extra review rules; `inline: off` = summary only).
# Token: org secret ORG_ANTHROPIC_TEAM_TOKEN (a `claude setup-token` Team seat token).
# Model: org/repo Variable BB_REVIEW_MODEL, default claude-sonnet-5; `deep-review` label → Opus 5.5 + high effort.
#
# This is a REQUIRED check, so it must never block a merge on its own: drafts and
# bot PRs are skipped (skipped = passing), and every step after checkout is non-fatal.
# Claude only runs once its config + review rules are pinned to the base branch
# (restore_base_config.sh), so a PR cannot steer its own review.
#
# One summary comment per PR, edited in place on every review (✅ fixed / 🆕 new);
# only new findings get inline comments, fixed ones get resolved. A push that only
# rebases (the PR's own changes are identical) skips Claude — see github_review.py.

name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      !endsWith(github.actor, '[bot]') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deep-review')
    # Several pushes in a row: only the newest commit gets reviewed. Job-level on
    # purpose: skipped runs (e.g. a bot adding a size label) must not cancel a review.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ORG_ANTHROPIC_TEAM_TOKEN }}
      CLAUDE_CODE_VERSION: 2.1.322
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEW_MODEL: ${{ (contains(github.event.pull_request.labels.*.name, 'deep-review') && 'claude-opus-5-5') || vars.BB_REVIEW_MODEL || 'claude-sonnet-5' }}
      REVIEW_EFFORT: ${{ contains(github.event.pull_request.labels.*.name, 'deep-review') && 'high' || 'medium' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch review tooling (same commit as this workflow)
        id: tooling
        continue-on-error: true
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          echo "workflow_ref=$WORKFLOW_REF workflow_sha=$WORKFLOW_SHA"
          shopt -s nocasematch
          if [[ "$WORKFLOW_REF" == Bird-Buddy/github-workflows/* ]]; then
            ref="$WORKFLOW_SHA"
          else
            ref=main
            echo "::warning::Unexpected workflow_ref '$WORKFLOW_REF' — using review tooling from main"
          fi
          dir="$RUNNER_TEMP/github-workflows"
          mkdir -p "$dir"
          gh api "repos/Bird-Buddy/github-workflows/tarball/$ref" | tar -xz -C "$dir" --strip-components=1
          echo "REVIEW_TOOLS=$dir/review" >> "$GITHUB_ENV"

      - name: Pin Claude config and review rules to the base branch
        id: pin
        if: steps.tooling.outcome == 'success'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash "$REVIEW_TOOLS/restore_base_config.sh"

      - name: Prepare (skip rebases, hand Claude its previous review)
        id: prepare
        if: steps.pin.outcome == 'success'
        continue-on-error: true
        env:
          EVENT_ACTION: ${{ github.event.action }}
        run: python3 "$REVIEW_TOOLS/github_review.py" prepare

      - uses: actions/setup-node@v5
        if: steps.pin.outcome == 'success' && steps.prepare.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install Claude Code CLI
        if: steps.pin.outcome == 'success' && steps.prepare.outputs.skip != 'true'
        continue-on-error: true
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Review PR
        if: steps.pin.outcome == 'success' && steps.prepare.outputs.skip != 'true'
        continue-on-error: true
        run: bash "$REVIEW_TOOLS/run_review.sh"

      - name: Post (update summary, new inline comments, resolve fixed)
        if: steps.pin.outcome == 'success' && steps.prepare.outputs.skip != 'true'
        continue-on-error: true
        run: python3 "$REVIEW_TOOLS/github_review.py" post
